# DERIVED — do not hand-edit `capabilities:`. It is the TRANSPOSE of template/capabilities.yml's
# per-capability `profiles:` field, and R-PROF (tests/Package.Tests/Tests.fs) asserts the two agree
# EXACTLY. capabilities.yml is in turn held to the scaffold's real `<!--#if -->` package gates by
# R-CAT, so this list is what a `sample-pack` product can actually `open` — not a wish. To change
# what this profile gets, change the template's gates; this file follows.
#
# This file used to under-report its own profile by FOUR capabilities (#511): the scaffold really
# does pin AND reference KeyboardInput, Layout, Controls and Testing here, and nothing said so.
name: sample-pack
description: Optional examples and sample assets.
capabilities: [scene, skiaviewer, elmish, keyboard-input, layout, controls, testing, samples]
governance: full
samples: true
sourceFrameworkMode: false
validationCommands: [Dev, Test, Verify]
