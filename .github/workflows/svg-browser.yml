name: svg-browser

on:
  push:
    branches: [main]
    paths:
      - 'src/Scene/**'
      - 'src/Scene.SvgBrowser/**'
      - 'tests/Scene.SvgBrowser.Tests/**'
      - 'tests/SvgSessionCorrespondence/**'
      - 'readiness/svg-scene-02-5/**'
      - 'readiness/svg-scene-02-6/**'
      - 'models/svg-foundation/**'
      - 'models/svg-runtime/**'
      - 'tests/Scene.Tests/SvgFoundationRetainedTests.fs'
      - 'tests/Scene.PortableConsumers/**'
      - 'Directory.Build.props'
      - 'Directory.Build.local.props'
      - 'Directory.Packages.props'
      - 'Directory.Packages.local.props'
      - 'FS.GG.Rendering.slnx'
      - '.github/workflows/svg-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Scene/**'
      - 'src/Scene.SvgBrowser/**'
      - 'tests/Scene.SvgBrowser.Tests/**'
      - 'tests/SvgSessionCorrespondence/**'
      - 'readiness/svg-scene-02-5/**'
      - 'readiness/svg-scene-02-6/**'
      - 'models/svg-foundation/**'
      - 'models/svg-runtime/**'
      - 'tests/Scene.Tests/SvgFoundationRetainedTests.fs'
      - 'tests/Scene.PortableConsumers/**'
      - 'Directory.Build.props'
      - 'Directory.Build.local.props'
      - 'Directory.Packages.props'
      - 'Directory.Packages.local.props'
      - 'FS.GG.Rendering.slnx'
      - '.github/workflows/svg-browser.yml'

concurrency:
  group: svg-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    needs: focus-comparison
    name: SVG browser adapter (packed Fable + Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/Scene.SvgBrowser.Tests/package-lock.json
      - name: Checkout exact Game runtime candidate
        uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Game
          ref: 996832a6ebb5c893199627b0ecc46f7c1da848cd
          path: _game-runtime-candidate
      - name: Restore browser harness packages
        working-directory: tests/Scene.SvgBrowser.Tests
        run: npm ci
      - name: Provision exact external-session Quint tool
        run: |
          mkdir -p "$RUNNER_TEMP/svg-external-tools"
          curl --fail --location --silent --show-error \
            https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 \
            --output "$RUNNER_TEMP/svg-external-tools/quint"
          echo '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  '"$RUNNER_TEMP/svg-external-tools/quint" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/svg-external-tools/quint"
      - name: Check external-session model, reducer and guard controls
        env:
          QUINT_BIN: ${{ runner.temp }}/svg-external-tools/quint
        run: |
          dotnet test tests/Scene.SvgBrowser.Policy.Tests/Scene.SvgBrowser.Policy.Tests.fsproj -c Release
          bash tests/SvgSessionCorrespondence/run-external-model.sh
          bash tests/SvgSessionCorrespondence/run-external-mutants.sh
      - name: Install Chromium, Firefox, WebKit and system dependencies
        working-directory: tests/Scene.SvgBrowser.Tests
        run: npx playwright-core install --with-deps chromium firefox webkit
      - name: Install Orca assistive-technology process
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gettext itstool libatspi2.0-dev libgtk-3-dev meson ninja-build openbox orca python-gi-dev python3-dasbus python3-dev python3-gi python3-speechd speech-dispatcher-espeak-ng xdotool xvfb
          git init "$RUNNER_TEMP/orca-source"
          git -C "$RUNNER_TEMP/orca-source" remote add origin https://gitlab.gnome.org/GNOME/orca.git
          git -C "$RUNNER_TEMP/orca-source" fetch --depth 1 origin a4e6375bdaebbade7974b9717b353bc864602b53
          git -C "$RUNNER_TEMP/orca-source" checkout --detach FETCH_HEAD
          python3 tests/Scene.SvgBrowser.Tests/prepare-orca-runtime.py "$RUNNER_TEMP/orca-source/src/orca/speech.py"
          meson setup -Dprefix="$RUNNER_TEMP/orca-49.8" "$RUNNER_TEMP/orca-source/_build" "$RUNNER_TEMP/orca-source"
          meson compile -C "$RUNNER_TEMP/orca-source/_build"
          meson install -C "$RUNNER_TEMP/orca-source/_build"
          echo "$RUNNER_TEMP/orca-49.8/bin" >> "$GITHUB_PATH"
      - name: Exercise packed adapter in all browser families
        env:
          SVG_SCENE_ORCA_OBSERVATION: ${{ runner.temp }}/svg-browser-observations.orca.json
          SVG_SCENE_ORCA_VERSION: 49.8+a4e6375bdaebbade7974b9717b353bc864602b53
        run: bash tests/Scene.SvgBrowser.Tests/run.sh "$RUNNER_TEMP/svg-browser-observations.json"
      - name: Compare exact Game and Rendering policy in .NET and Fable
        run: bash tests/SvgSessionCorrespondence/run.sh "$GITHUB_WORKSPACE/_game-runtime-candidate"
      - name: Qualify frozen SVG scale workloads on the hosted diagnostic environment
        env:
          SVG_SCENE_PERFORMANCE_MODE: diagnostic
          SVG_SCENE_SELF_RUNNING_OUTPUT: ${{ runner.temp }}/svg-browser-observations.self-running.json
          SVG_SCENE_SELF_RUNNING_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tests/Scene.SvgBrowser.Tests/run-performance.sh "$RUNNER_TEMP/svg-scale-qualification.json"
      - name: Upload browser observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-browser-observation
          path: |
            ${{ runner.temp }}/svg-browser-observations*.json
            ${{ runner.temp }}/svg-browser-observations*.orca.log
            ${{ runner.temp }}/svg-browser-observations.self-running*.log
            ${{ runner.temp }}/svg-browser-observations*.exported.svg
            ${{ runner.temp }}/svg-scale-qualification.json
          if-no-files-found: warn

  focus-comparison:
    name: Packed original/candidate DOM focus comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare exclusive hosted attempt evidence
        env:
          FOCUS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'svg-focus-comparison'
          root.mkdir(mode=0o700)
          evidence = root / 'evidence'
          evidence.mkdir(mode=0o700)
          with (evidence / 'hosted-attempt.json').open('x') as stream:
              json.dump({'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'candidateHead': os.environ['FOCUS_CANDIDATE_SHA'], 'job': os.environ['GITHUB_JOB'], 'nativeJourneyAcceptance': False}, stream)
          PY
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout protected production baseline
        uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Rendering
          ref: f3eb5abb117042144a1cbb41a5ec43821642df74
          path: _focus-original
          persist-credentials: false
      - name: Set up selected .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Set up selected Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: tests/Scene.SvgBrowser.Tests/package-lock.json
      - name: Restore exact browser harness
        working-directory: tests/Scene.SvgBrowser.Tests
        run: npm ci
      - name: Install matching Chromium and hosted dependencies
        working-directory: tests/Scene.SvgBrowser.Tests
        run: npx playwright-core install --with-deps chromium
      - name: Compare separately packed original and candidate fixtures
        env:
          FOCUS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tests/Scene.SvgBrowser.Tests/run-focus-comparison.sh "$RUNNER_TEMP/svg-focus-comparison"
      - name: Record original terminal step status even on preparation failure
        if: always()
        env:
          FOCUS_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'svg-focus-comparison'
          evidence, upload = root / 'evidence', root / 'upload'
          upload.mkdir(mode=0o700)
          status = {'statusBeforeUpload': os.environ['FOCUS_JOB_STATUS'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'coverage': 'actual result required; absent result is incomplete', 'nativeJourneyAcceptance': False}
          files = list(evidence.iterdir()) if evidence.is_dir() else []
          admitted = len(files) <= 128 and all(p.is_file() and not p.is_symlink() for p in files) and sum(p.stat().st_size for p in files) <= 4194304 - 4096
          if admitted:
              for path in files:
                  shutil.copyfile(path, upload / path.name)
          else:
              status.update({'firstCause': 'upload population/budget refused', 'coverage': 'incomplete; original evidence omitted, no oversized proof uploaded'})
          body = (json.dumps(status) + '\n').encode()
          if len(body) > 4096: raise RuntimeError('terminal status oversized')
          with (upload / 'hosted-step-status.json').open('xb') as stream: stream.write(body)
          if sum(p.stat().st_size for p in upload.iterdir()) > 4194304: raise RuntimeError('upload promotion budget refused')
          if not admitted: raise RuntimeError('upload population/budget refused; bounded receipt retained')
          PY
      - name: Retain bounded focus evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-product-focus-comparison
          path: ${{ runner.temp }}/svg-focus-comparison/upload/*
          if-no-files-found: warn
