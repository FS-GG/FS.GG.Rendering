name: svg-browser

on:
  push:
    branches: [main]
    paths:
      - 'src/Scene/**'
      - 'src/Scene.SvgBrowser/**'
      - 'tests/Scene.SvgBrowser.Tests/**'
      - 'readiness/svg-scene-02-5/**'
      - 'readiness/svg-scene-02-6/**'
      - 'models/svg-foundation/**'
      - 'tests/Scene.Tests/SvgFoundationRetainedTests.fs'
      - 'tests/Scene.PortableConsumers/**'
      - 'Directory.Build.props'
      - 'Directory.Build.local.props'
      - 'Directory.Packages.props'
      - 'Directory.Packages.local.props'
      - 'FS.GG.Rendering.slnx'
      - '.github/workflows/svg-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Scene/**'
      - 'src/Scene.SvgBrowser/**'
      - 'tests/Scene.SvgBrowser.Tests/**'
      - 'readiness/svg-scene-02-5/**'
      - 'readiness/svg-scene-02-6/**'
      - 'models/svg-foundation/**'
      - 'tests/Scene.Tests/SvgFoundationRetainedTests.fs'
      - 'tests/Scene.PortableConsumers/**'
      - 'Directory.Build.props'
      - 'Directory.Build.local.props'
      - 'Directory.Packages.props'
      - 'Directory.Packages.local.props'
      - 'FS.GG.Rendering.slnx'
      - '.github/workflows/svg-browser.yml'

concurrency:
  group: svg-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: SVG browser adapter (packed Fable + Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/Scene.SvgBrowser.Tests/package-lock.json
      - name: Restore browser harness packages
        working-directory: tests/Scene.SvgBrowser.Tests
        run: npm ci
      - name: Install Chromium, Firefox, WebKit and system dependencies
        working-directory: tests/Scene.SvgBrowser.Tests
        run: npx playwright-core install --with-deps chromium firefox webkit
      - name: Install Orca assistive-technology process
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gettext itstool libatspi2.0-dev libgtk-3-dev meson ninja-build orca python-gi-dev python3-dev python3-gi python3-speechd speech-dispatcher-espeak-ng xdotool xvfb
          git init "$RUNNER_TEMP/orca-source"
          git -C "$RUNNER_TEMP/orca-source" remote add origin https://gitlab.gnome.org/GNOME/orca.git
          git -C "$RUNNER_TEMP/orca-source" fetch --depth 1 origin 8152882b15e8810e1f174be3012e7a55b66fa3eb
          git -C "$RUNNER_TEMP/orca-source" checkout --detach FETCH_HEAD
          meson setup -Dprefix="$RUNNER_TEMP/orca-48.10" "$RUNNER_TEMP/orca-source/_build" "$RUNNER_TEMP/orca-source"
          meson compile -C "$RUNNER_TEMP/orca-source/_build"
          meson install -C "$RUNNER_TEMP/orca-source/_build"
          echo "$RUNNER_TEMP/orca-48.10/bin" >> "$GITHUB_PATH"
      - name: Exercise packed adapter in all browser families
        env:
          SVG_SCENE_ORCA_OBSERVATION: ${{ runner.temp }}/svg-browser-observations.orca.json
          SVG_SCENE_ORCA_VERSION: 48.10+8152882b15e8810e1f174be3012e7a55b66fa3eb
        run: bash tests/Scene.SvgBrowser.Tests/run.sh "$RUNNER_TEMP/svg-browser-observations.json"
      - name: Qualify Preview-A workload controls on the hosted diagnostic environment
        env:
          SVG_SCENE_PERFORMANCE_MODE: diagnostic
        run: bash tests/Scene.SvgBrowser.Tests/run-performance.sh "$RUNNER_TEMP/svg-preview-a-performance.json"
      - name: Upload browser observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-browser-observation
          path: |
            ${{ runner.temp }}/svg-browser-observations*.json
            ${{ runner.temp }}/svg-browser-observations*.orca.log
            ${{ runner.temp }}/svg-browser-observations*.exported.svg
            ${{ runner.temp }}/svg-preview-a-performance.json
          if-no-files-found: warn
