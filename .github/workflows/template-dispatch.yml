name: template-dispatch

# Sender half of the `fs-gg-ui-template` cross-repo contract (Feature 216 — adopts the org reusable
# App-token dispatch-sender, superseding the Feature 214 bespoke stored-PAT send).
#
# When Rendering publishes a FS.GG.UI.Template coherent-set release — the template-scoped tag
# `fs-gg-ui-template/v<version>` (Feature 206) — notify the repos that consume that release, so each
# opens its own bump/flip PR for that version. No manual step (US1). Two consumers today, both keyed
# on the same `fs-gg-ui-template-released` event:
#   - FS-GG/FS.GG.Templates — `upstream-bump.yml` opens a pin-bump PR (Feature 216, the original US1).
#   - FS-GG/.github         — `feed-autofix.yml` flips the `registry/dependencies.yml` row
#                             (FS.GG.Rendering#847). Latency only: it also runs on a daily schedule.
#
# `derive` owns what is uniquely Rendering's (canonical-repo guard + version derivation/validation
# from the tag); one `dispatch*` job per consumer `uses:` the org reusable workflow, which mints a
# run-time GitHub App installation token scoped to ITS target and POSTs the repository_dispatch. No
# long-lived cross-repo secret remains on Rendering (US2). A `uses:` job cannot also run `steps:`, so
# derivation must be its own preceding job (research R4). It runs ONCE and every sender reads its
# output, so the targets cannot be told different versions; a new consumer is one more `dispatch*`
# job, and the canonical-repo guard on `derive` keeps forks from reaching any of them.
#
# Disjoint from release.yml: that workflow triggers on `v*`; this one triggers ONLY on
# `fs-gg-ui-template/v*`. The slash makes the globs unable to match the same tag, so release.yml is
# untouched (FR-006) and the trigger pattern itself is the "only genuine template releases" guard.
#
# The manual workflow_dispatch entry is for operator inspection only: a manual run lands on a non-tag
# ref, so version derivation fails and `derive` fails loudly rather than sending (FR-005).
#
# Feature 218 — `workflow_call` is now the PRIMARY entry. `release-tags.yml` cuts
# `fs-gg-ui-template/v<version>` with `GITHUB_TOKEN`, and a `GITHUB_TOKEN` tag push starts no workflow
# run, so the `push:` trigger below would never fire on a real release. The cutter therefore calls this
# workflow directly with the version it cut. The `push:` trigger is retained for a human-pushed tag.
on:
  push:
    tags: ['fs-gg-ui-template/v*']
  workflow_call:
    inputs:
      version:
        description: "Released template version, without any tag prefix (e.g. 0.1.52-preview.1)."
        type: string
        required: true
  workflow_dispatch: {}

concurrency:
  group: template-dispatch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  derive:
    name: Derive released template version
    runs-on: ubuntu-latest
    # Canonical-repo guard (FR-004, US3): forks never reach the sender. Because `dispatch` needs this
    # job, a fork (where `derive` is skipped) never starts `dispatch` — no send, no credential exposure.
    if: github.repository == 'FS-GG/FS.GG.Rendering'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # `derive-template-version.sh` stays the SINGLE validator of a released template version, on
      # every entry path. A `workflow_call` run has no template tag in `github.ref` (it inherits the
      # caller's ref, `refs/heads/main`), so rather than teaching the job a second, unvalidated way to
      # learn the version, we hand the script the tag ref that version implies. The regex it already
      # enforces then guards the call too: a caller passing `main`, an empty string, or `v1.2` fails
      # loudly here and NOTHING is dispatched (FR-005), exactly as a malformed tag would.
      # NOT `GITHUB_REF:` — the runner reserves the GITHUB_* namespace and re-injects its own value,
      # so that override is declared in the step log and then ignored by the process. On a
      # workflow_call that meant the script read the caller's `refs/heads/main` and refused to derive,
      # which is how the FS.GG.UI 0.4.0 cut published the set but never notified Templates.
      - id: v
        name: Derive + validate version from the tag ref
        env:
          RELEASE_TAG_REF: ${{ inputs.version && format('refs/tags/fs-gg-ui-template/v{0}', inputs.version) || github.ref }}
        run: bash scripts/derive-template-version.sh

  dispatch:
    name: Notify FS.GG.Templates of template release
    needs: derive
    # Delegates credential minting + the cross-repo POST to the org reusable workflow (App-token,
    # run-time-minted, scoped to the target). Pinned by commit SHA (research R2).
    uses: FS-GG/.github/.github/workflows/dispatch-sender.yml@5fed2838f9ed085ffca09f4cc18b4f7bc59c1294  # main as of 2026-06-28
    with:
      target-repo: FS-GG/FS.GG.Templates
      event-type: fs-gg-ui-template-released
      version: ${{ needs.derive.outputs.version }}
    # Explicit mapping is mandatory: `secrets: inherit` cannot bind the hyphenated callee ports
    # `app-id`/`app-private-key` (real secret names have no hyphens) — research R1. The source names
    # are the org Actions secrets `FSGG_DISPATCH_APP_ID`/`FSGG_DISPATCH_APP_PRIVATE_KEY`, confirmed by
    # org-admin 2026-06-28 (FS-GG/.github#22; the earlier `APP_ID`/`APP_PRIVATE_KEY` assumption was
    # wrong — proven by the live run on tag fs-gg-ui-template/v0.1.52-preview.1 which read them empty).
    # Both repos are public, so org secrets are consumable on the free org plan.
    secrets:
      app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
      app-private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}

  dispatch-github:
    name: Notify FS-GG/.github of template release
    needs: derive
    # The SECOND consumer of the same event (FS.GG.Rendering#847). `.github`'s `feed-autofix.yml`
    # already listens for `fs-gg-ui-template-released` and, on it, re-derives the coherent set from
    # the live org feed and opens the PR that flips `registry/dependencies.yml` — the last consumer
    # of a template release still flipped by hand (FS-GG/.github#748).
    #
    # LATENCY ONLY, and deliberately not load-bearing — do not make it so. `feed-autofix`'s PRIMARY
    # trigger is a daily schedule that works with no change here; this only moves the flip from
    # "within a day" to "within minutes". That is worth having because `.github`'s `feed-coherence`
    # gates on TIME, not on diff, so every branch cut from `.github@main` inherits the red while the
    # row is stale — FS-GG/.github#744, touching no registry content, was blocked by exactly that.
    #
    # So this job failing costs latency, not correctness: the receiver ignores `client_payload`
    # entirely and re-derives from the feed, leaving no dispatch-only path to rot. Keep it that way.
    # This fabric has twice failed to fire (the manual `release.yml` path sends nothing; the 0.4.0
    # send was wrong via `env: GITHUB_REF:`, #232) — a receiver keyed only on it inherits both.
    #
    # A separate job, not a second target on `dispatch`: the reusable sender takes ONE `target-repo`
    # and mints a token scoped to it, so one job per target is the contract. It also keeps the two
    # notifications independent — Templates is still notified when this one fails, and vice versa.
    uses: FS-GG/.github/.github/workflows/dispatch-sender.yml@5fed2838f9ed085ffca09f4cc18b4f7bc59c1294  # main as of 2026-06-28
    with:
      target-repo: FS-GG/.github
      event-type: fs-gg-ui-template-released
      version: ${{ needs.derive.outputs.version }}
    # Same explicit mapping, and for the same reason as `dispatch` above: `secrets: inherit` cannot
    # bind the hyphenated callee ports.
    #
    # PRECONDITION, and the only way this job fails: the `fs-gg-cross-repo-dispatch` App (installation
    # 143110413, FS-GG/.github#22) is installed with `repository_selection: selected` — an explicit
    # repo list, NOT org-wide — so FS-GG/.github must be ON that list or `create-github-app-token`
    # fails and this job reds. Its `contents: write` is already the right permission (that is what
    # POST /repos/{o}/{r}/dispatches requires), so the list is the whole question. Being in the same
    # org buys nothing here. An org-admin can read the list; the account this repo's CI authenticates
    # as cannot (`GET /user/installations/143110413/repositories` → 403), which is why this is a note
    # rather than a check. If it reds, add the repo to the installation — do not delete this job: the
    # flip still lands within a day via `feed-autofix`'s schedule, so the red costs latency only.
    secrets:
      app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
      app-private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
