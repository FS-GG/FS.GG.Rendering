name: gate

# The pre-merge gate. Fast, deterministic, runs on every change. It is the ONLY workflow intended to
# be a required check (see docs/ci/cadence-map.md §5).
#
# ENFORCED: BOTH the `Deterministic gate` job (ADR-0100) and its sibling `api-compatibility-gate`
# job (ADR-0101 authorized, ADR-0103 records the elevation) are required status checks on `main`.
# A red run of either blocks the merge button, and `enforce_admins` is ON — `--admin` does not
# bypass it. A `CP####` break wedges the PR, and the remedy is to CUT A SEMVER MAJOR: the break is
# the only signal forcing that bump. Do NOT reach for `ApiCompatGenerateSuppressionFile` to go green
# — blanket suppression INVERTS the gate and ships a silent break under a preview-patch (ADR-0101,
# "Why not require it and suppress the three breaks"). A suppression is legitimate only as ADR-0102
# used one: `IsBaselineSuppression`, a single diagnostic and target, and a note saying when to delete
# it. See docs/ci/cadence-map.md §5.1 for the exact context strings and the exit-code table
# (BREAK/Indeterminate block; FeedUnavailable/NoBaselineYet do not).
# `release.yml` / `capability.yml` are advisory and must never be required (FR-007).
#
# "Require branches to be up to date" is deliberately OFF: it serializes merges under the ADR-0021
# parallel-work model. This job also runs on `push: main`, so a bad interleaving reds `main` rather
# than being caught pre-merge. That is the chosen trade.
#
# THE RELEASE TAG WINDOW IS CLOSED (#218). Between a release bump landing on `main` and its tag
# triple being pushed, PRs that did not bump fail `pin-no-tag` / `pkg-no-release-tag` — the pin they
# inherit resolves to a tag that does not exist yet — and with the gate required those PRs are
# BLOCKED, not merely informed. That window used to stay open until an operator noticed and pushed
# the tags by hand. It no longer exists as a manual step: `.github/workflows/release-tags.yml` runs
# on `push: main`, reads the pending triple out of the coherence guard's RELEASE-PENDING block, cuts
# it in the mandated order, and then CALLS `release.yml` / `template-dispatch.yml` (a `GITHUB_TOKEN`
# tag push starts no workflow run, so the downstream lanes must be invoked, not awaited).
#
# What remains is bounded by that workflow's own run, not by anyone's attention: a PR whose gate run
# starts inside it can still red, and re-running the gate after the cut lands turns it green. A
# release PR itself is NOT expected-red — the guard's RELEASE-PENDING waiver covers it.
#
# MERGE METHOD IS LOAD-BEARING. `bumpedInCommitUnderTest` (scripts/validate-version-coherence.fsx)
# reads `HEAD~1..HEAD`. A rebase-merge splits a release across two commits, so the second is seen as
# a bump-less change and the package lane reds on `main`. Squash-merge and merge-commit keep the
# whole release in one diff. Rebase merging is disabled on this repo for that reason (ADR-0100).
#
# Contracts: specs/005-ci-cadence-wiring/contracts/{gate-contract,run-summary.schema}.md
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pushes/PRs cancel in-flight runs so a stale red/green never misleads (Edge Case:
# concurrent pushes). PR runs key off the PR ref; branch pushes off the branch ref.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No privileged secrets are used, so fork PRs run and get a real signal (FR-001, FR-013).
permissions:
  contents: read

jobs:
  gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    env:
      # 235 (FR-002) — the SINGLE source of truth for GL-capability test projects. Both the
      # deterministic tier (which excludes them) and the GL step (which runs them) read this one
      # list, and the Build.Tests cadence meta-guard (CadenceCoverageTests) asserts it is a subset
      # of the slnx test set. Keep the `GL_TEST_PROJECTS:` key stable — the meta-guard parses it.
      GL_TEST_PROJECTS: "SkiaViewer Smoke"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # T015/T029 (Feature 209, D2) — the version-coherence guard reads `git tag --list
        # 'fs-gg-ui/v*'`; without full history/tags `git tag` is empty and the guard fails
        # closed (exit 2). fetch-depth: 0 makes the snapshot tags visible.
        with:
          fetch-depth: 0

      # SDK pinning decision: docs/ci/cadence-map.md §1 (no global.json in repo).
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # 211 (FR-002/FR-004) — locked restore against committed packages.lock.json. On a graph that
      # differs from the lockfile (or an un-pinnable version, NU1603) restore fails and the gate
      # blocks. The RestoreLockedMode property (Directory.Build.props) makes the repo behave like the
      # generated products; --locked-mode forces it explicitly. This is the gate's restore
      # enforcement point (the build below uses --no-restore), so NU1603/NU1608 promotion is
      # anchored here.
      #
      # 482 (FS-GG/.github#429) — the restore is COLD, and that is the whole point of the action:
      # a WARM one validates the committed contentHash against the package copy already on the
      # runner, never contacting the feed, so it compares a record of reality against another record
      # of it. The enforcement, the error text and the --force-evaluate regenerate hint live in ONE
      # place, because two inline copies is how they drift — this comment used to claim it was "the
      # single restore enforcement point" while packaged-consumer.yml quietly ran a second, warm one.
      #
      # That claim is now TRUE, and repo-wide: #559 routed release.yml's three slnx restores through
      # this same action, so every locked restore in this repo — the two gate lanes and the lane that
      # actually PUBLISHES — is cold, `--configfile`-pinned, and defined here. The release lane was the
      # one that mattered most and was fixed last: its `dotnet build`/`dotnet restore` were already
      # locked restores that nobody had written as one (RestoreLockedMode, Directory.Build.props, turns
      # locked mode on implicitly whenever GITHUB_ACTIONS is true), just warm ones — so a lock file no
      # fresh clone could restore could be green here and still ship.
      #
      # Keep it that way: a new `dotnet restore`/`dotnet build` of the slnx in ANY workflow is a fourth
      # copy of this policy, and it will be a warm one by default.
      - name: Restore (locked, cold)
        uses: ./.github/actions/locked-restore
        with:
          target: FS.GG.Rendering.slnx

      # T007 (FR-002) — a build failure MUST fail the gate. Debug so test/harness steps reuse it
      # with --no-build. The slnx contains src + all local-tier tests + the harness — and, since #540,
      # Package.Tests too.
      #
      # #540 — that exclusion used to be the rule ("it does NOT contain Package.Tests (release-only), so
      # no release check can leak into the gate"), and it cost more than it bought. Keeping the project
      # out of the slnx kept release checks off the PR, but it also kept ~325 WORKING-TREE rules off the
      # PR: the capability catalog, the skill-manifest digests, R-CAT, R-PROF. Every one of them fired
      # after the merge that broke it, never on it — which is how Renovate PR #233 reached 4/4 green on a
      # pin no local pack could produce (see the version-coherence step below, which had to move its own
      # rule out of Package.Tests for exactly this reason).
      #
      # The release checks do NOT leak in, because they were never held out by the SOLUTION — they are
      # deferred by their own env flags, which only release.yml sets (FS_SKIA_RUN_PACKAGE_CONSUMER_SMOKE,
      # FS_GG_RUN_TEMPLATE_PAYLOAD_RESTORE). The split is by TIMING and it lives in the code, where the
      # author writing the rule can see it. Membership costs this gate ~4s.
      # --no-restore: restore already happened in the locked step above (FR-002, GR3) — exactly once.
      - name: Build solution (net10.0)
        run: dotnet build FS.GG.Rendering.slnx -c Debug --no-restore

      # T013 (US2, FR-005/FR-010) — classify the runner (display? GL?) up front; the GL-dependent
      # steps key off this output rather than guessing. Informational: probe never gates.
      - name: Probe runner capability
        id: probe
        uses: ./.github/actions/harness-evidence
        with:
          subcommand: probe
          cadence: gate
          label: probe (runner capability)
          out: artifacts/harness/probe
          artifact-name: harness-probe
          # required-tiers intentionally empty: probe is informational, never gates.

      # T008 (FR-002/FR-003) — the default local deterministic tier (capability `none`). Any
      # failure MUST fail the gate. --no-build reuses the Debug build above.
      #
      # 235 (FR-001/FR-003) — the project list is DERIVED from FS.GG.Rendering.slnx, not hardcoded:
      # every slnx `tests/*.Tests` project except the GL-capability ones (which run in the GL step
      # below) runs here. This closes the "test project in the solution but in no cadence" class by
      # construction — a newly added test project is picked up automatically; the Build.Tests
      # CadenceCoverageTests meta-guard asserts this coverage holds. A project that genuinely needs
      # GL fails LOUDLY here (never a silent skip) until it is added to GL_TEST_PROJECTS.
      - name: Default local tier (deterministic, slnx-derived)
        run: |
          set -euo pipefail
          for proj in $(grep -oE 'tests/[^"]+\.Tests\.fsproj' FS.GG.Rendering.slnx | sort -u); do
            name="$(basename "$(dirname "$proj")" .Tests)"
            case " $GL_TEST_PROJECTS " in *" $name "*) echo "skip (GL step): $proj"; continue;; esac
            echo "::group::dotnet test $proj"
            dotnet test "$proj" -c Debug --no-build
            echo "::endgroup::"
          done

      # 295 — EXECUTE the one runnable artifact in the fs-gg-symbology skill.
      #
      # Every other check that mentions reference.fsx asserts only that the file EXISTS and is
      # byte-mirrored across the skill roots (Feature231SkillManifestTests, materialize-skill-roots,
      # validate-lifecycle-template). None asserts it compiles. That is how six shipped features
      # (194, 195, 196-200) each updated the skill's prose while the script quietly stopped
      # exercising any of them, until it demonstrated the design loop with its own lint step deleted.
      #
      # So: run it, and pin the verdict SEQUENCE it must print. The script already fails loud on its
      # own (`failwith` on both rounds); the assertions below make the expected output part of the
      # gate rather than a comment that can drift from the code beneath it. A capacity change that
      # un-fires the seeded overload reds here instead of silently demonstrating a backstop with
      # nothing left to catch.
      #
      # No extra build: the Debug build above already produced the Symbology + Symbology.Render DLLs
      # the in-tree script `#r`s. `#r "nuget: SkiaSharp"` resolves from nuget.config's single source
      # (fsi loads a bare `#r` DLL alone, so Skia must be asked for by name — see the script header).
      - name: Symbology skill reference recipe (runs the design loop)
        run: |
          set -euo pipefail
          # tee, not capture: on a `failwith` the script's own diagnostic goes to stderr and the
          # verdict lines it printed before dying still have to reach the log. Outside the worktree,
          # so the surface-baseline / coherence drift steps below never see a stray untracked file.
          log="$(mktemp)"
          dotnet fsi src/Symbology/skill/reference.fsx | tee "$log"
          out="$(cat "$log")"

          fail() { echo "::error::reference.fsx: $1"; exit 1; }

          grep -qE '^round 1: HasWarnings$' <<<"$out" \
            || fail "round 1 must score HasWarnings — the recipe teaches the loop by showing a warning"
          grep -qE 'Speed overloaded: 5 distinct levels used, capacity 4' <<<"$out" \
            || fail "round 1 must name Speed as the overloaded channel, over capacity 4"
          grep -qE '^[[:space:]]+units: \[4\]$' <<<"$out" \
            || fail "round 1 must name ONLY the units past capacity (expected [4]); naming the whole board is the #295 regression"
          grep -qE '^round 2 \(after tweak\): Clean$' <<<"$out" \
            || fail "round 2 must score Clean — the ChannelMap tweak has to clear every finding"

          for grammar in Token Badge Ring; do
            grep -qE "^${grammar}[[:space:]]+board PNG: " <<<"$out" \
              || fail "one unchanged mapUnit must render a ${grammar} board via galleryIn"
          done

          echo "reference.fsx ran the whole loop: seeded overload -> named unit 4 -> tweak -> Clean -> 3 grammars"

      # #300 — the OFFLINE half of the packaged-consumer gate: does every sample pin still mirror
      # `src/*/*.fsproj` `<Version>`?
      #
      # This rule already had a test — `tests/Package.Tests/Feature163PackageFeedValidationTests.fs`,
      # "all package-consuming samples' FS.GG.UI pins match source-controlled package versions". But
      # Package.Tests was RELEASE-ONLY and not in the slnx, so it ran after the merge that broke it,
      # never on the PR. That is how Renovate PR #233 reached `4/4 green` while proposing a
      # `0.4.0` pin no local `dotnet pack` can produce: the samples map `FS.GG.UI.*` exclusively to
      # the machine-local feed, and the bot reads `nuget.pkg.github.com`. Nothing pre-merge read the
      # files it changed.
      #
      # #540 PUT PACKAGE.TESTS IN THE SLNX, so that test now runs on the PR — this step and it are no
      # longer the same rule at two cadences. This step is kept deliberately: it is an independent,
      # dependency-free reading of the same invariant, and #300's whole point was that a rule this
      # cheap should not have a single point of failure. If you ever find yourself deleting one of
      # them, delete THIS one — the test is the better-specified half — and say so out loud.
      #
      # `--mode check` touches NO network and packs nothing: it reads the 16 `src` `<Version>`s and
      # the 57 sample `PackageReference` pins as text and compares them. That is why it belongs in
      # the required gate, while the pack-restore-BUILD proof — whose subject IS a feed — stays a
      # separate non-required workflow (`packaged-consumer.yml`), exactly as
      # `template-payload-restore-gate` is split from its env-free half. See cadence-map §4b/§5.
      #
      # NO `--sample` ARGUMENTS ON PURPOSE. The harness discovers the package-consuming samples (a
      # sample qualifies by mapping `FS.GG.UI.*` to the local feed in its own `nuget.config`), so a
      # fifth one is gated by construction. Naming four here would rebuild the omission that left
      # this path ungated — the same reason the deterministic tier derives its projects from the slnx.
      # `package-feed` exits 2 if it finds none, so the check cannot silently pass over an empty set.
      #
      # Exit 1 on a stale pin; the harness names each offending pin and then the mirror rule, so the
      # next reader fixes the pin instead of bumping `<Version>` to match it.
      # `--out`/`--feed` live in RUNNER_TEMP so the evidence files never land in the worktree, where
      # the drift steps below would see them as untracked.
      - name: Sample pins mirror src <Version> (offline)
        run: |
          set -euo pipefail
          if ! dotnet run --project tools/Rendering.Harness/Rendering.Harness.fsproj -c Debug --no-build -- \
              package-feed --mode check \
              --feed "$RUNNER_TEMP/package-feed-check/feed" \
              --out "$RUNNER_TEMP/package-feed-check"; then
            echo "::error::a samples/ FS.GG.UI.* pin disagrees with src <Version> — see the stale-pin lines above. The sample pin MUST mirror src/*/*.fsproj <Version>; fix the pin, not <Version>."
            exit 1
          fi

      # T009 (FR-003) — public .fsi surface-drift across all 9 committed baselines. Regenerate in
      # place and fail on ANY uncommitted change: a modified baseline = surface drift; an untracked
      # new baseline = a package gained a surface with no committed baseline (the spec's
      # "first run with no baseline" edge — fails, never silently passes). The generator writes
      # directly to readiness/surface-baselines/ (the single authoritative location the live gate
      # `SurfaceAreaTests` reads), so this is the canonical regenerate-then-git-diff check.
      - name: Surface-baseline drift (.fsi)
        run: |
          set -euo pipefail
          dotnet fsi scripts/refresh-surface-baselines.fsx
          if ! git diff --quiet -- readiness/surface-baselines; then
            echo "::error::public .fsi surface drift — run scripts/refresh-surface-baselines.fsx and commit the updated baselines."
            git --no-pager diff -- readiness/surface-baselines
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- readiness/surface-baselines)"
          if [ -n "$untracked" ]; then
            echo "::error::new public surface baseline(s) not committed (first-run-with-no-baseline fails the gate):"
            echo "$untracked"
            exit 1
          fi
          echo "no .fsi surface drift across $(ls readiness/surface-baselines/*.txt | wc -l) committed baselines"

      # Feature 209 (T015/T029/T031, FR-001..009) — version-staleness / coherence guard. Mirrors the
      # surface-baseline "regenerate-and-fail-on-drift" pattern above. Runs BOTH layers merge-blocking:
      #   * structural verdict-core (env-free): pin matches an existing fs-gg-ui/v* tag and does not lag
      #     the latest (preview-aware), single [$version$] BOM token, B.ids==P.members, template pins all
      #     derive through $(FsGgUiVersion) == the 12-member manifest, build.fsx regex still resolves —
      #     independent of any warnings-as-errors policy (FR-004).
      #   * scoped restore-grounded proof (FS_GG_RUN_VERSION_COHERENCE_SMOKE=1): one Release pack + one
      #     clean restore of FS.GG.UI@V asserting the COMPLETE 16-member set resolves to exactly V
      #     (FR-008, anti-text-grep). The deeper product-from-template build stays on release.yml.
      # Non-zero exit (1 drift / 2 guard-error) fails the gate ⇒ PR blocked from merging to main. The
      # script echoes the DRIFT lines to $GITHUB_STEP_SUMMARY on failure (SC-006).
      # 482 — this step must NOT inherit the locked-restore action's NUGET_PACKAGES. The smoke builds
      # its own clean consumer and isolates it with `globalPackagesFolder` in a generated nuget.config
      # (validate-version-coherence.fsx), and the NUGET_PACKAGES *environment variable* OVERRIDES that
      # config key. Inheriting it would silently redirect the "clean restore" into the shared package
      # folder, so a cached FS.GG.UI@V could satisfy a member the freshly-packed feed never produced —
      # restore-partial would report green on a partial graph. Unsetting restores exactly the
      # environment this step had before the action existed.
      - name: Version coherence guard
        run: |
          set -euo pipefail
          unset NUGET_PACKAGES
          dotnet fsi scripts/validate-version-coherence.fsx
          FS_GG_RUN_VERSION_COHERENCE_SMOKE=1 dotnet fsi scripts/validate-version-coherence.fsx

      # #541 — this repo ships FROZEN MIRRORS of four product skills whose canonical bodies live in
      # FS.GG.Game (ADR-0022 §6), and until now NOTHING here knew they existed. `skill-parity` only
      # checks wrapper↔body parity WITHIN this repo, so an author could edit a body Rendering does not
      # own, pass every required gate, merge — and the break surfaced later, in another repo's red gate,
      # after the context that produced the edit was gone. It happened three times to fs-gg-persistence
      # alone, each time under a full set of green checks, each time by an author doing correct work who
      # was never told they were editing a mirror.
      #
      # It FAILS rather than warns, deliberately: all three breaks merged under six green checks, and a
      # warning in that stream is a warning nobody reads.
      #
      # Needs GH_TOKEN because it reads the org registry (FS-GG/.github registry/skills.yml) — the only
      # place that records who OWNS each skill and the canonical digest. A registry it cannot read is a
      # HARD FAIL, not a skip: a check that did not run has proved nothing (the apicompat-check.sh rule).
      - name: Frozen skill-mirror guard (you are editing a body this repo does not own)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          unset NUGET_PACKAGES
          dotnet fsi scripts/check-frozen-mirrors.fsx

      # #241 — the OFFLINE half of the template payload pin guard. The three axis literals in
      # template/base/Directory.Packages.props become a scaffolded product's pins; this step proves
      # they are well-formed, declared once, derived through an axis (never a bare literal, which no
      # axis bump would sweep), and that every scaffold profile resolves at least one pin — a profile
      # that restores nothing would otherwise report a vacuous pass (#266). It touches no network, so
      # it belongs in the required gate. The restore-grounded half — does the payload actually
      # resolve, and to a stable graph — needs nuget.org and runs in `template-payload-restore-gate`
      # below, which stays NON-required. Unlike `api-compatibility-gate` (now required, ADR-0103) it
      # has no elevation path: ApiCompat reads a feed only to FIND A BASELINE, so a silent feed is
      # classifiable as `FeedUnavailable` → exit 0. The restore gate's SUBJECT *is* the feed — "the
      # payload did not restore" is the verdict, and a nuget.org outage is indistinguishable from a
      # bad pin. It must stay unable to wedge the repo. See cadence-map §5 / §4b.
      - name: Template payload pins — structural verdict-core (env-free)
        run: dotnet fsi scripts/validate-template-payload-pins.fsx

      # #106 (refs #104/#105) — lifecycle-template verdict-core drift guard, PR-time. The Feature-204
      # gating invariant is classified by TWO parallel sources: this fsx's env-free verdict-core
      # (`verifyGatedSources`) and Package.Tests' independent `gatedSourceAudit`. A PR that adds/moves a
      # template.json source under `template/product-skills/` or `.agents/skills/` and updates only ONE
      # classifier desyncs them. That failure USED to be release-only (Package.Tests) and, worse, silent —
      # #540 put Package.Tests in the slnx, so `gatedSourceAudit` now runs on the PR too and this is belt
      # AND braces rather than the only brace. The silence is why it needed both: the
      # release test self-provisions its report by running THIS script, so a stale verdict-core throws,
      # writes no report, and its stderr is swallowed — surfacing only as "lifecycle validation report
      # missing" pointing at CI regeneration, not the real cause (it blocked the fs-gg-ui 0.1.64-preview.1
      # set until #105). Run the env-free `--emit-report` path here so drift fails THIS PR loudly with the
      # actual `VERDICT-CORE FAIL: …` exception. Env-free only (no dotnet new/build/GL/network; ~1s): the
      # empty FS_GG_RUN_LIFECYCLE_VALIDATION keeps it off the live-loop path. Non-zero exit ⇒ gate blocks.
      - name: Lifecycle-template verdict-core guard (env-free)
        run: |
          set -euo pipefail
          if ! FS_GG_RUN_LIFECYCLE_VALIDATION= dotnet fsi scripts/validate-lifecycle-template.fsx --emit-report; then
            echo "::error::lifecycle-template verdict-core drift — scripts/validate-lifecycle-template.fsx (verifyGatedSources) disagrees with the template.json gated-source classification. See the VERDICT-CORE FAIL line above; keep it in lockstep with Package.Tests' gatedSourceAudit (refs #104/#106)."
            exit 1
          fi

      # T010 (FR-003) — fsdocs site build in STRICT mode so FsDocsWarnOnMissingDocs (Directory.Build.props)
      # is fatal: a broken docs build OR a missing-doc stub fails the gate. Build only, no publish.
      - name: Docs build (fsdocs, strict)
        run: |
          set -euo pipefail
          dotnet tool install --global fsdocs-tool
          export PATH="$PATH:$HOME/.dotnet/tools"
          # The global tool installs a `fsdocs` command (not a `dotnet-fsdocs` shim), so invoke it
          # directly — `dotnet fsdocs` looks for a nonexistent `dotnet-fsdocs` and fails.
          fsdocs build --strict

      # T011 (FR-004) + T015 (FR-005/FR-011) — ONE offscreen invocation emits T0/run.json and
      # T1/run.json. The action reads each tier's run.json.status (NOT the aggregate process exit
      # code, which is 1 whenever T1 is cleanly skipped). T0 is required; T1 is advisory and a
      # headless skip discloses under notProvedHere without reddening the gate.
      - name: Harness offscreen (T0 required, T1 advisory)
        uses: ./.github/actions/harness-evidence
        with:
          subcommand: offscreen
          required-tiers: T0
          cadence: gate
          label: harness offscreen (T0 det / T1 readback)
          out: artifacts/harness/offscreen
          artifact-name: harness-offscreen

      # T014 (FR-005/FR-010/FR-011) — GL-dependent local checks. On a headless runner (no hardware
      # GL) they are SKIPPED with a written, machine-readable rationale and never affect pass/fail.
      # When GL is present they run and a real failure fails the gate. A misconfiguration (GL claimed
      # present but the test harness itself errors) surfaces as a real failure with probe facts, not
      # a silent skip.
      - name: GL local checks (SkiaViewer + Smoke) — degrade & disclose
        env:
          GL_PRESENT: ${{ steps.probe.outputs.gl }}
        run: |
          set -euo pipefail
          if [ "$GL_PRESENT" != "present" ]; then
            {
              echo "### Proof scope — GL local checks (cadence: gate)"
              echo ""
              echo "**notProvedHere:**"
              echo "- SkiaViewer.Tests, Smoke.Tests — rationale: \"no hardware GL on hosted runner\" (probe: gl=${GL_PRESENT}); not run, not failed."
              echo ""
              echo "**overall (GL local checks): evidence-only (skipped, disclosed)**"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "GL absent (probe gl=${GL_PRESENT}); SkiaViewer.Tests + Smoke.Tests skipped-with-rationale, gate unaffected."
            exit 0
          fi
          echo "GL present; running GL-dependent local checks."
          # 235 (FR-002) — same GL_TEST_PROJECTS source of truth as the deterministic tier's exclude.
          for p in $GL_TEST_PROJECTS; do
            echo "::group::dotnet test tests/${p}.Tests"
            dotnet test "tests/${p}.Tests/${p}.Tests.fsproj" -c Debug --no-build
            echo "::endgroup::"
          done
          {
            echo "### Proof scope — GL local checks (cadence: gate)"
            echo ""
            echo "**proved:**"
            echo "- SkiaViewer.Tests, Smoke.Tests (GL present on this runner)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # API compatibility gate (H3 / FS-GG/.github#20, epic FS-GG/.github#16 Pillar 5). Packs each
  # IsPackable FS.GG.UI.* project and compares it against its published baseline on the org GitHub
  # Packages feed via the .NET SDK's Package Validation / ApiCompat — the F#-viable detector
  # (Microsoft.CodeAnalysis.PublicApiAnalyzers is C#-only). A removed/changed public member is a
  # break that must force a SemVer major (registry coherence id `apicompat-publicapi-gate`).
  #
  # "ADVISORY" MEANS NOT-REQUIRED, NOT continue-on-error (#216). This job has NO `continue-on-error`
  # and must not grow one. Advisory is a statement about branch protection — this job's context is
  # not in the required set, so a red here informs a merge rather than blocking one. It is NOT a
  # statement that the job may report success when it failed. `continue-on-error: true` would paint
  # the check green whatever it found, which is the green-by-omission class this gate exists to
  # detect, and would make the elevation below meaningless. The contradiction #216 named — "advisory"
  # prose next to a job that reddens the run — resolves in favour of the job: it should redden.
  #
  # ENFORCING AT THE WORKFLOW LEVEL (FS-GG/.github#20 resolved): a SEPARATE job (Package Validation
  # stays OFF in the normal build/release, so the required `gate` job above is unaffected). The
  # detector's exit codes, per scripts/apicompat-check.sh:
  #
  #   1  a genuine CP#### break        red   — the gate ran and found a break
  #   3  a packable failed to pack     red   — the gate did NOT run; that is not a pass (#216)
  #   0  OK / NoBaselineYet            green — the gate ran, or had nothing to compare against
  #   0  FeedUnavailable  + ::error::  green — the gate did not run, for a reason external to the
  #                                           change. Loud, never silent. Includes the fork-PR case
  #                                           (no token), so forks still merge (FR-001/FR-013).
  #
  # Exit 3 is the #216 fix. From Feature 211 to #186 every packable failed to pack with NU1403, the
  # script classified all 17 as Indeterminate, and exited 0 — the job was green while comparing
  # nothing. A pack failure is the tree failing to build; the feed's availability is a separate axis,
  # split out as FeedUnavailable so ADR-0101's bound still holds (requiring this job takes a
  # dependency on the feed, and a feed outage must not wedge the repo).
  #
  # WHY NOT A REQUIRED CHECK YET (#219, ADR-0101). Not because the detector is weak — it is a sound
  # hard gate — but because it was RED ON `main` AS OF 2026-07-09, and a required check that is red
  # on the base branch wedges every merge in the repo. Three packables carried public-API breaks that
  # no published major had discharged: FS.GG.UI.Controls (`CustomControlDefinition<'msg>` lost its
  # type parameter), FS.GG.UI.DesignSystem (`IntentPolicy` moved out of the `StyleResolver` module,
  # and `Theme` lost `IComparable`), and FS.GG.UI.Themes.AntDesign (which re-exports that policy).
  # The gate is doing its job: those breaks force the next FS.GG.UI release to be a SemVer major.
  #
  # THAT SENTENCE HAS AN EXPIRY. #225 cut `0.4.0-preview.1` to discharge exactly those three; this
  # job goes green the moment that major is PUBLISHED to the feed (the cut alone is not enough — the
  # baseline is read from the feed, not from the tree). Do not read the paragraph above as current
  # state. The live answer is one line: the `summary:` line in this job's log, which now also reports
  # how many packables were actually `compared`.
  #
  # DO NOT re-derive that red from folklore. Until 2026-07-09 both this comment and ADR-0100 blamed
  # the `FS.GG.UI.Canvas.Audio` removal from specs/252 — but `FS.GG.UI.Canvas` reports OK, and Audio
  # appears in none of the CP#### lines. The run log is the source of truth; read it before
  # asserting a cause.
  #
  # ELEVATION IS A ONE-LINE CHANGE, on ONE precondition: this job goes green on `main` (i.e. the
  # major that discharges the three breaks is published to the feed). Then add the context named by
  # this job's `name:` to branch protection's required set — cadence-map §5 already authorizes it
  # and lists the exact string. No workflow or script change is needed.
  #
  # The baseline this compares against is each package's LATEST published feed version, computed as
  # a SemVer max — see the `latest_version` note in scripts/apicompat-check.sh for why it must never
  # be read off either end of the feed's `versions` array.
  api-compatibility-gate:
    name: API compatibility gate (breaking-change → SemVer major)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: ApiCompat vs feed baseline
        env:
          NUGET_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_FEED_USER: ${{ github.actor }}
        run: bash scripts/apicompat-check.sh

  # #241 — template payload restore gate (refs #235, #238, FS-GG/.github#266).
  #
  # `template/base/Directory.Packages.props` declares the three version axes a SCAFFOLDED PRODUCT
  # restores. Nothing in CI ever restored them: Package.Tests reads the file as text and asserts axis
  # STRUCTURE while explicitly disclaiming the VALUE, and template payload is content rather than a
  # nuspec dependency, so NU5104 cannot see it. A pin that was stale, prerelease, yanked, or simply
  # nonexistent passed every check in this repo. That is how #235 happened — a stable fs-gg-ui 0.4.0
  # template scaffolded products restoring PRERELEASE FS.GG.Game.* / FS.GG.Audio.*, with
  # $(FsGgGameVersion) two minors stale, red nowhere for months.
  #
  # This job restores each of the five scaffold profiles for real, on the template's real TFM, and
  # asserts the RESOLVED GRAPH: no prerelease `FS.GG.*` anywhere including transitively (a prerelease
  # enters through a dependency without ever appearing in the props file — FS.GG.Game.Render reaches
  # down to FS.GG.UI.Scene, so a regex over the three literals is insufficient); NU1603/NU1608 promoted
  # to errors so a nonexistent pin cannot resolve upward silently; and the Game/Audio pins not lagging
  # feed-newest (the staleness direction, as `.github`'s check-feed-coherence.py does for the registry).
  #
  # A SEPARATE JOB, not a step of the required `gate`: this reads nuget.org, and requiring a
  # feed-dependent check takes a dependency on that feed's availability — an outage must not wedge
  # every merge in the repo. `api-compatibility-gate` reads a feed too and IS required (ADR-0103),
  # because it can tell a silent feed apart from a break (`FeedUnavailable` → exit 0). This job
  # cannot: the feed is its SUBJECT, so an outage is indistinguishable from a bad pin. It has no
  # elevation path and must stay non-required (cadence-map §4b/§5).
  # NOT-REQUIRED is NOT `continue-on-error` (#216): this job has none and must not grow one.
  # A red here is the gate reporting what it found. Its exits: 0 coherent · 1 drift · 2 guard error
  # (feed unreachable / restore tooling failed / zero pins matched) — it fails CLOSED, per #266's rule
  # that "nothing to check" and "checked, and it's fine" must not share an exit code.
  #
  # The env-free structural half runs in the required `gate` job above; this invocation re-runs it
  # first (the script always does) and then proves the graph.
  #
  # NOT expected-red on a release PR any more (#506). The pin bump is what CAUSES the publish, so at PR
  # time $(FsGgUiVersion) necessarily names a version nuget.org does not carry, and this gate reported
  # `pin-not-published` + NU1102 on all five profiles — by construction, on every framework release
  # (0.8.0 #426, 0.9.0 #498), merged past both times. That red was byte-identical to a GENUINE bad pin,
  # so it camouflaged the defect it exists to catch. The script now waives it as RELEASE-PENDING, on the
  # $(FsGgUiVersion) axis alone and only when THIS commit bumped it — mirroring the coherence guard's
  # `PinPending`. Game/Audio ship from other repos, where a bump here publishes nothing; those stay red.
  template-payload-restore-gate:
    name: Template payload restore gate (scaffolded pins resolve, stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The RELEASE-PENDING waiver asks `git diff HEAD~1 HEAD -- template/base/Directory.Packages.props`
        # ("did THIS commit bump the pin?"). The default shallow checkout has no `HEAD~1`, and the guard
        # fails CLOSED (exit 2) rather than silently reverting to the always-red gate #506 removed.
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore the template payload and assert the resolved graph
        env:
          FS_GG_RUN_TEMPLATE_PAYLOAD_RESTORE: '1'
        run: dotnet fsi scripts/validate-template-payload-pins.fsx

  # #475 — skill parity. `scripts/check-agent-skill-parity.fsx` was a real check that ran only when a
  # human remembered to: it was referenced by NO workflow. So `docs/reports/skills-parity.md` — a
  # TRACKED, DERIVED artifact — drifted, and on main it was a day stale with a whole skill (fs-gg-game-core)
  # silently dropped out of its table, under a `Checked at UTC` line asserting a freshness it did not have.
  #
  # This is the repo's own recurring class (#252, #255, #435, #216): a committed evidence file whose
  # generator no gate runs. The two steps below are the two halves of actually closing it, and BOTH are
  # needed — either alone is a fail-open.
  #
  # 1. Run the check. It exits non-zero when parity FAILS.
  # 2. Diff the regenerated report against the committed one. Because step 1 REGENERATES the report and
  #    exits on the parity STATUS, it is perfectly happy to rewrite a stale file and report `passed` —
  #    which is precisely how the artifact rotted while the script "worked". The generator was made
  #    deterministic in #475 (the wall-clock timestamp is gone; it now lives in the JSON summary) so that
  #    this exact-diff is meaningful rather than a guaranteed false positive.
  skill-parity-gate:
    name: Skill parity gate (report regenerates clean, every product skill has a wrapper)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check skill parity
        run: |
          set -euo pipefail
          if ! dotnet fsi scripts/check-agent-skill-parity.fsx; then
            echo "::error::skill parity FAILED — see the findings above. A 'missing-wrapper' finding against the manifest means a skill the manifest declares as 'scope: product' (it materializes into every generated workspace) has no activation wrapper under .claude/skills or .agents/skills in this repo (refs #475/#465)."
            exit 1
          fi

      - name: Assert the committed parity report is not stale
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat -- docs/reports/skills-parity.md; then
            echo "::error::docs/reports/skills-parity.md is STALE — it is a committed, derived artifact and the run above regenerated it into something different. Run 'dotnet fsi scripts/check-agent-skill-parity.fsx' and commit the result. (The report is deterministic: a diff here is real drift, not a timestamp — refs #475.)"
            git diff -- docs/reports/skills-parity.md
            exit 1
          fi

      - name: Upload the parity summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-parity
          path: |
            docs/reports/skills-parity.md
            artifacts/skill-parity/skill-parity-summary.json
          if-no-files-found: warn

  # #452 — the LIVE lifecycle-validation lane. This is the only thing in the repo that checks what a
  # scaffold actually EMITS, as opposed to what template.json SAYS: it instantiates every
  # profile x lifecycle combination with `dotnet new` and audits the emitted tree.
  #
  # It existed, and it ran NOWHERE. It is gated behind FS_GG_RUN_LIFECYCLE_VALIDATION=1, and nothing
  # set it — so it rotted red on main, unseen, through four separate features that widened or narrowed
  # a skill's gate without updating its expectations (#90, #91, #430, and the eight capability skills
  # sample-pack shares with game). #434 is the concrete cost of that blindness: a skill defaulted off
  # materialized into ZERO workspaces org-wide and no gate noticed, because the unit tests check the
  # PREDICATE and only this lane checks the EMISSION.
  #
  # THREE THINGS ABOUT THIS JOB ARE LOAD-BEARING. Please read before "simplifying" it.
  #
  # 1. It is a SEPARATE JOB, and the env-free `Lifecycle-template verdict-core guard` in the required
  #    `gate` job above keeps its deliberately-empty FS_GG_RUN_LIFECYCLE_VALIDATION=. That empty value
  #    is not the bug — it is what keeps that ~1s structural guard off this heavy path. Do not "fix"
  #    #452 by setting it to 1 there: that turns a one-second guard into a scaffold-everything loop
  #    inside the critical required job.
  #
  # 2. It runs UNCONDITIONALLY — no `paths:` filter, no `if:`. A lane that only runs when someone
  #    predicted in advance which paths could break it is a lane that reports green on the PR that
  #    breaks it in a way nobody predicted, which is precisely the failure being closed here. The full
  #    live loop is ~22s (four profiles x three lifecycles, no build, no GL, no network), so there is
  #    nothing to buy by making it conditional.
  #
  # 3. The script installs THIS WORKING TREE's template into a scoped DOTNET_CLI_HOME before the loop
  #    (`installTemplateUnderTest`). Do not "helpfully" add a `dotnet new install .` step here: until
  #    #452 the loop scaffolded from whatever FS.GG.UI.Template package was installed on the machine,
  #    so it audited a PUBLISHED PACKAGE and reported a verdict as though it had proven something about
  #    the tree under review. A CI lane wired up that way would be worse than none: green, fast, and
  #    about the wrong artifact.
  #
  # Fails CLOSED (`set -euo pipefail`, non-zero ⇒ red), per #266: "nothing to check" and "checked, and
  # it's fine" must not share an exit code.
  lifecycle-live-gate:
    name: Lifecycle-template live gate (scaffolds every profile × lifecycle, audits the emitted tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Scaffold every profile × lifecycle and audit what it emitted
        env:
          FS_GG_RUN_LIFECYCLE_VALIDATION: '1'
        run: |
          set -euo pipefail
          if ! dotnet fsi scripts/validate-lifecycle-template.fsx; then
            echo "::error::live lifecycle-template validation failed — a scaffold EMITTED something the audit did not expect (or omitted something it required). This is the emission, not the predicate: the unit tests can all pass while this is red. See the exception above; if you widened or narrowed a skill's gate, update expectedFrameworkSkills in scripts/validate-lifecycle-template.fsx in the SAME change (refs #452)."
            exit 1
          fi

      # The report is the lane's evidence. Keep it on a red run too — that is when it is worth reading.
      - name: Upload the lifecycle validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-template-validation
          path: specs/204-template-lifecycle-symbol/readiness/lifecycle-template-validation.md
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Lock-range coherence (FS-GG/.github#495, adopted per #521; ADR-0006, epic #266).
  #
  # THE BLIND SPOT. `dotnet restore --locked-mode` validates package entries — id, version,
  # contentHash — and NEVER looks at the dependency ranges under a `"type": "Project"` entry. So a
  # release bump that edits a `<Version>` and regenerates no lock leaves every sibling project
  # reference recording the OLD version, and every gate here stays green over it, the cold locked
  # restore included. That is not hypothetical: FS.GG.Game's `main` has carried a stale range since
  # `release: v0.4.0`. This repo has the org's largest exposure — 196 ranges across 38 lock files.
  #
  # Harmless at runtime (project references resolve from the project graph, not the lock), which is
  # exactly why it survives. The cost is a poisoned lock diff at the one moment the repo can least
  # afford noise: the reviewer scrutinising a contentHash reads it mixed with release-bump residue.
  #
  # Static — committed files only. No restore, no SDK, no network, no feed, no NuGet auth.
  # ---------------------------------------------------------------------------------------------
  lock-ranges:
    uses: FS-GG/.github/.github/workflows/lock-range-coherence.yml@main
    with:
      # NOT the default. The gate's default floor is 1, and FS-GG/.github#545 is open against exactly
      # that: a range is only a SUBJECT if its dependency resolves to a package id this repo produces,
      # and a range that stops resolving is silently skipped rather than failed. With the floor at 1,
      # 195 of our 196 ranges could vanish — a renamed <PackageId>, a project moving under a
      # Directory.Build.props the walker stops at — and the gate would still print
      # "ok: all 1 project-reference range(s) ..." and go green. A check that inspects one subject and
      # reports on 196 is the epic #266 defect living inside the guard built to catch it.
      #
      # So the floor is the REAL subject count, verified against this repo before it is changed. A silent
      # skip then fails the gate instead of shrinking it.
      #
      # It is a floor, not an equality: adding a project raises the count and stays green. A DROP is
      # what must never be silent — so if a project is legitimately removed, lower this number in the
      # same change, and let that be a decision somebody made rather than an omission nobody noticed.
      #
      # 196 (38 lock files) -> 219 (39) in #540, which put tests/Package.Tests in the slnx and therefore
      # under the locked-restore policy, giving it a committed lock with 12 project-reference ranges of
      # its own. Raised in the same change that raised the count, per the rule above.
      min-ranges: 219

  # ---------------------------------------------------------------------------------------------
  # Build-config drift check (shared-build-config; ADR-0006 / ADR-0032, adopted per #538).
  #
  # Directory.Build.props and Directory.Packages.props are DISTRIBUTED files: their source of truth is
  # FS-GG/.github → dist/dotnet/, and their own header says "DO NOT EDIT in a consumer repo — edits are
  # overwritten on the next sync and fail the drift check (check mode)."
  #
  # Until now nothing here ran that check, so that sentence was simply false: this repo could diverge
  # from the org config — and had — with no signal at all. Every sibling adopter (Game, Governance, SDD)
  # runs one. A gate that is green on a subject it never checks is strictly worse than a red one; the
  # red at least tells you.
  #
  # Static: two checkouts and a diff. No SDK, no restore, no feed, no NuGet auth.
  # ---------------------------------------------------------------------------------------------
  build-config-drift:
    name: Build-config drift check (shared-build-config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The source of truth. Tracked at `main` deliberately, exactly as the sibling adopters track it:
      # the POINT of this check is to notice when the org moves and this repo has not followed, so
      # pinning a SHA here would defeat it — the check would go on passing against a frozen snapshot
      # while the thing it calls the source of truth drifted away from it.
      - name: Checkout the org build config
        uses: actions/checkout@v7
        with:
          repository: FS-GG/.github
          ref: main
          path: _org-build

      - name: Assert this repo's build config matches the org source of truth
        run: |
          set -euo pipefail
          if ! _org-build/scripts/sync-build-config.sh --check "$GITHUB_WORKSPACE"; then
            echo "::error::build-config drift — Directory.Build.props / Directory.Packages.props / .config/dotnet-tools.json differ from FS-GG/.github → dist/dotnet/. These are DISTRIBUTED files: do not hand-edit them here. Re-sync with 'scripts/sync-build-config.sh <repo>' from a checkout of FS-GG/.github and commit the result. If the sync changes what the restore graph resolves (ADR-0032), regenerate the lock files in the SAME commit."
            exit 1
          fi
