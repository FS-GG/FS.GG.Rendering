name: Templates external reference source transport

on:
  pull_request:
    paths:
      - '.github/workflows/templates-external-reference-qualification.yml'
      - 'scripts/verify-templates-external-reference-workflow.py'
      - 'scripts/check-templates-pin-reachability.py'
  workflow_dispatch:
    inputs:
      rendering-input-source:
        description: Historical candidate, retained font-disposal, held current-public, or unpublished palette composition
        type: choice
        options:
          - candidate
          - font-disposal
          - current-public-composition
          - palette-heading
        default: candidate
      rendering-successor-input:
        description: Actual acquired first-attempt palette 0.32.4 producer coordinates; empty supplies no candidate
        type: string
        default: ''
      native-input-facility:
        description: Exact reviewed Noble native-input facility JSON; empty supplies no pins or admission
        type: string
        default: ''
      preflight-only:
        description: Verify original archive transport only; false runs the selected complete receiver qualification
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  static:
    name: Exact Templates call controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/verify-templates-external-reference-workflow.py
        env:
          QUALIFICATION_EVENT: ${{ github.event_name }}
          QUALIFICATION_INPUT_SOURCE: ${{ inputs.rendering-input-source }}
          QUALIFICATION_PREFLIGHT_JSON: ${{ toJSON(inputs.preflight-only) }}
          QUALIFICATION_NATIVE_INPUT_FACILITY: ${{ inputs.native-input-facility }}
          QUALIFICATION_SUCCESSOR_INPUT: ${{ inputs.rendering-successor-input }}
      - name: Every pinned Templates commit is reachable from Templates main
        run: python3 scripts/check-templates-pin-reachability.py
        env:
          GH_TOKEN: ${{ github.token }}
  qualify:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.rendering-input-source != 'font-disposal' && inputs.rendering-input-source != 'current-public-composition' && inputs.rendering-input-source != 'palette-heading') }}
    needs: static
    name: Original producer archive preflight or explicit full reference gate
    uses: FS-GG/FS.GG.Templates/.github/workflows/fable-external-reference-source.yml@6a5dd5305ac6fe26f9f9726c72b1a7e553b0021b
    with:
      templates-source: 6a5dd5305ac6fe26f9f9726c72b1a7e553b0021b
      rendering-input-source: candidate
      preflight-only: ${{ github.event_name == 'pull_request' || inputs.preflight-only }}
  # Original4ec producer/run39509314882-a1/artifact12305198394; no repack.
  # This selects receiver/Studio-font/Orca qualification, not publication or whole4709 acceptance.
  qualify-font-disposal:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rendering-input-source == 'font-disposal' }}
    needs: static
    name: Exact retained0.32.3 receiver, Studio-font and Orca qualification
    uses: FS-GG/FS.GG.Templates/.github/workflows/fable-external-reference-source.yml@2f8d400a6a670568044d607a1ac0eb2c7c655a29
    with:
      templates-source: 2f8d400a6a670568044d607a1ac0eb2c7c655a29
      rendering-input-source: font-disposal
      preflight-only: ${{ inputs.preflight-only }}
  # #4817 source prerequisite: actual runtime/operator admission is separate.
  # The selected callee retains CURRENT_PUBLIC_AT_ADMISSION=None; a full request
  # fails before acquisition/setup. Preflight never promotes itself to full AT.
  qualify-current-public-composition:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rendering-input-source == 'current-public-composition' }}
    needs: static
    name: Current published composition and held AT journey
    uses: FS-GG/FS.GG.Templates/.github/workflows/fable-external-reference-source.yml@d867ea9216118dc649ce52be6c9bcecdfb46e4e3
    with:
      templates-source: d867ea9216118dc649ce52be6c9bcecdfb46e4e3
      rendering-input-source: current-public-composition
      current-public-at-admission: ''
      native-input-facility: ${{ inputs.native-input-facility }}
      preflight-only: ${{ inputs.preflight-only }}
  # Original producer remains the separately qualified4ede source; caller/executor may advance.
  # The accepted retained-original evidence (run 40744519859) used Templates 72a54c27, a PR-head commit that
  # became unreachable when Templates #806 was squash-merged; GitHub cannot resolve it as a reusable workflow
  # and the whole caller failed to parse. The call now uses the merged #806 commit; that evidence is not relabelled.
  # Runtime coordinates are supplied only after authenticated original archive acquisition.
  qualify-palette-heading:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rendering-input-source == 'palette-heading' }}
    needs: static
    name: Retained 0.32.4 originals and complete unpublished palette journey
    uses: FS-GG/FS.GG.Templates/.github/workflows/fable-external-reference-source.yml@fe24d30872c84d4c1c92afd7a05c5cf22d00bb10
    with:
      templates-source: fe24d30872c84d4c1c92afd7a05c5cf22d00bb10
      rendering-input-source: palette-heading
      rendering-successor-input: ${{ inputs.rendering-successor-input }}
      preflight-only: ${{ inputs.preflight-only }}
