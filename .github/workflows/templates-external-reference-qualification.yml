name: Templates external reference source transport

on:
  pull_request:
    paths:
      - '.github/workflows/templates-external-reference-qualification.yml'
      - 'scripts/verify-templates-external-reference-workflow.py'
  workflow_dispatch:
    inputs:
      preflight-only:
        description: Verify original archive transport only; false runs full three-family qualification
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  static:
    name: Exact Templates call controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/verify-templates-external-reference-workflow.py
  qualify:
    needs: static
    name: Original producer archive preflight or explicit full reference gate
    uses: FS-GG/FS.GG.Templates/.github/workflows/fable-external-reference-source.yml@d90c55e768afc2fbed14a3c6e234fa346f61da41
    with:
      templates-source: d90c55e768afc2fbed14a3c6e234fa346f61da41
      preflight-only: ${{ github.event_name == 'pull_request' || inputs.preflight-only }}
