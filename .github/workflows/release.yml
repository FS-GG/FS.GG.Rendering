name: release

# Release-only cadence. Runs the packaging/consumption checks that are too heavy for the push gate
# and only meaningful at a release: Package.Tests and the generated-product tests from the template.
# This workflow is NEVER a required check and NEVER runs on push/PR (FR-008, SC-007).
# Cadence contract: specs/005-ci-cadence-wiring/contracts/cadence-matrix.md (release row).
#
# Feature 218 — this workflow is also `workflow_call`-able, and that is how a release now publishes.
# `release-tags.yml` cuts the tag triple on `main` with `GITHUB_TOKEN`, whose pushes deliberately do
# not start new workflow runs, and then CALLS this workflow with the version it cut. Publishing is a
# data dependency of the cut, not an event race. The `push: tags: ['v*']` trigger is retained as the
# operator's manual escape hatch (and for a tag pushed by a human), not as the primary path.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: "Version to pack+publish, without the leading `v` (e.g. 0.1.51-preview.1). Must equal the repo's <Version> at the called SHA — the publish job asserts it."
        type: string
        required: true
      # #681 — RUN THE VALIDATORS WITHOUT PUBLISHING, so `release-tags.yml` can prove this commit is
      # releasable BEFORE it pushes a tag that cannot be un-pushed.
      #
      # THE NAME IS NEGATIVE ON PURPOSE. `validate-only: false` is the default and the publishing path;
      # an affirmative `publish: true` would look nicer and would be a live bug, because for the
      # `push: tags` / `release` / `workflow_dispatch` triggers the `inputs` context is EMPTY. GitHub
      # casts across types when comparing, so `inputs.publish != false` evaluates `null != false` as
      # `0 != 0` — FALSE — and the escape-hatch publish would silently stop running. Phrased as
      # `!inputs.validate-only`, an absent input is falsy, `!falsy` is true, and every non-call trigger
      # keeps publishing exactly as before. Do not "improve" this to a positive flag.
      validate-only:
        description: "Run the release validators and publish NOTHING (#681 — release-tags.yml's pre-cut gate). Default false: the normal publishing path."
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack+publish (e.g. 0.1.51-preview.1). Required to actually push on a manual run; omit for a pack-only dry run."
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-tests:
    name: Package consumption (release-only)
    runs-on: ubuntu-latest
    # Restrict to the canonical repo: fork tags/dispatch never run this (no fork secret exposure, FR-013).
    if: github.repository == 'FS-GG/FS.GG.Rendering'
    env:
      # Feature 209 — THE RELEASE LANE. This job gates `publish-packages` (needs:), so it is the last
      # thing standing between a version bump and the public feeds. The coherence mirror's
      # RELEASE-PENDING waivers exist because a tag cannot point at a commit that does not exist yet —
      # true only BEFORE the merge. Here every tag is due, so nothing is pending and a missing tag is
      # drift. Belt to the successor-tag braces: those bounds can only see a mis-order that LEFT A TAG
      # BEHIND, and a publish need not leave one.
      #
      # This flag bounds the WAIVERS; it does not bind the guard's SUBJECT. The guard only ever validates
      # the REPO's `<Version>`, while `publish-packages` resolves what it ships from the trigger. On a
      # `workflow_dispatch` those differ: an arbitrary `inputs.version` was green here (the repo is
      # coherent) and shipped untagged, and template-dispatch.yml — which fires only on
      # `fs-gg-ui-template/v*` — never ran. `publish-packages` now asserts the two are the same string
      # before it packs (see "Verify the version to publish is the version the guard validated"), so a
      # dispatch can only republish the version this job proved coherent.
      #
      # #681 — AND IT IS OFF ON THE PRE-CUT RUN, WHICH IS NOT A WEAKENING. `release-tags.yml` now calls
      # this workflow ONCE BEFORE it pushes any tag (`validate-only: true`), so that a commit whose
      # validators fail never gets a tag it cannot take back. On THAT run the tags genuinely do not exist
      # yet — cutting them is what comes next — so the RELEASE-PENDING waivers are exactly right, and
      # forcing them off would red the gate by construction on every release: precisely the always-red
      # lane #506 removed, reintroduced one workflow up. On the real (publishing) call the flag is "1",
      # every tag is due, and a missing one is drift — unchanged.
      #
      # Any value that is not the literal "1" disables it (both readers test `= "1"`), so the string here
      # is chosen to SAY WHY it is off rather than to be a cryptic "0".
      FS_GG_VERSION_COHERENCE_RELEASE_LANE: ${{ inputs.validate-only && 'off-pre-cut-tags-not-yet-pushed' || '1' }}
      # The pack -> fresh-consumer -> build -> run path. Too slow for the push gate, so it is opt-in
      # everywhere else; the release lane is the "somewhere" it must run. Package.Tests asserts this
      # flag is set here, so deleting it fails the build rather than silently un-testing the packages.
      FS_SKIA_RUN_PACKAGE_CONSUMER_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The Feature 209 coherence mirror in Package.Tests re-derives the verdict from the
          # fs-gg-ui/v* snapshot tags (git tag --list). Default shallow checkout has no tags ⇒ the
          # guard fails CLOSED ("tags must be visible (fetch-depth: 0)"). Fetch full history + tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # 559 — the RELEASE lane restores COLD, exactly as the gate does since #482. `dotnet build` below
      # implied a restore, and `Directory.Build.props` turns `--locked-mode` on for ANY restore on CI —
      # so this job was already doing a locked restore that nobody had written as one, against the
      # runner's WARM package folder and with no `--configfile`. Both properties are the ones #482
      # removed from the gate (FS-GG/.github#429): a warm `--locked-mode` validates the committed
      # contentHash against the copy already on the runner instead of against the FEED, so it can be
      # green on a lock file no fresh clone could restore — and this is the lane that SHIPS.
      - name: Restore (locked, cold)
        uses: ./.github/actions/locked-restore
        with:
          target: FS.GG.Rendering.slnx

      # 453: this step no longer exists for the Surface-baseline tests. They used to reflect over
      # src/<Pkg>/bin/Debug/net10.0/*.dll and needed the solution built first; they now bind each
      # FS.GG.UI.* package by type through a ProjectReference, so `dotnet test` builds what it
      # reflects over. The step is kept because other Package.Tests suites shell out to `dotnet`
      # against this repo (Tests.fs packs to a throwaway feed and builds a generated consumer);
      # whether they still need a warm solution build was NOT established by 453 — check before
      # removing it.
      #
      # --no-restore: the locked, cold restore above is the one restore (gate.yml's pattern, FR-002/GR3).
      - name: Build solution (warms the suites that shell out to dotnet against this repo)
        run: dotnet build FS.GG.Rendering.slnx --no-restore
      # Package.Tests has been a slnx MEMBER since #540 — it is NOT "outside the solution", and every
      # clause that used to follow from that is now false: the locked, cold restore above already covers
      # it (that is what validates its committed lock file against the feed), and gate.yml already runs
      # it on every PR, in Debug, off the slnx-derived test list.
      #
      # It is run AGAIN here, directly, for the one thing the PR gate cannot give it: this job's
      # FS_SKIA_RUN_PACKAGE_CONSUMER_SMOKE=1, which opts in the pack -> fresh-consumer -> build -> run
      # suite that is too slow for the push gate (Package.Tests asserts the flag is set here, so
      # dropping it fails the build rather than silently un-testing the packages).
      #
      # `-c Release` runs the SUITE in the configuration this lane ships. It does NOT drive the smoke:
      # the smoke shells out with its own explicit `-c Release` to pack, build and run the throwaway
      # consumer (see tests/Package.Tests/Tests.fs), so it is independent of this flag. Do not infer a
      # link that is not there — a plausible-but-wrong rationale here is what this comment is fixing.
      #
      # So do NOT delete this step as "redundant with the gate": the gate never sets the flag, so its
      # run skips the smoke entirely, and the smoke runs nowhere else.
      - name: Run Package.Tests
        run: dotnet test tests/Package.Tests/Package.Tests.fsproj -c Release

  # NOTE (#680): this job is NO LONGER the only thing that compiles the scaffolded product. `gate.yml`'s
  # `generated-product-gate` now scaffolds all five profiles and compiles + runs their tests on EVERY PR,
  # sharing this job's feed setup verbatim via `.github/actions/product-local-feed`. That is deliberate:
  # what remains release-only here is what is genuinely release-shaped — the STOCK `dotnet run` path and
  # the ADR-0024 audio consumer edge — and everything else has moved left, because a gate that only ever
  # runs at publish time discovers its findings at the worst possible moment (#679).
  #
  # Keep this job anyway. It is the last line of defence, it runs against the real release commit, and it
  # asserts things the PR gate does not.
  template-product-tests:
    name: Generated product (template instantiation, release-only)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.Rendering'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # #680: the pin + pack + user-level NuGet.Config + feed assertion used to live inline here, and
      # were the ONLY copy. They are now the shared `.github/actions/product-local-feed`, used verbatim
      # by `gate.yml`'s PR-time `generated-product-gate` as well — so the gate that is supposed to
      # PREDICT this job restores from a feed built exactly the way this job's feed is built. Two
      # hand-maintained copies would drift, and the first thing the drift would cost is the prediction.
      # All the reasoning that was in this block (why pack rather than restore the published pin; why
      # the USER-LEVEL config and not `dotnet nuget add source`; the #186/#225 NU1102 history; why the
      # pack must not take --no-restore) moved with it — read it there.
      #
      # The cold locked restore below still runs FIRST, and must: it deliberately restores with the
      # REPO's `nuget.config`, before the action writes the user-level config that adds the local feed,
      # so it sees exactly the sources a fresh clone does. 559 — cold, locked, config-pinned, as the
      # gate has restored since #482.
      - name: Restore (locked, cold)
        uses: ./.github/actions/locked-restore
        with:
          target: FS.GG.Rendering.slnx

      - name: Pack the framework set (at the pin) to a runner-local feed
        uses: ./.github/actions/product-local-feed

      # Exercise the real consumer path: install the in-repo `dotnet new` template, instantiate a
      # product, and run THAT generated product's tests (template/base/tests/Product.Tests becomes
      # the generated product's tests). This is gated on the instantiation tooling actually working
      # — a broken template or generated app fails here, which is exactly what this release-only
      # check exists to catch. We do NOT reference a top-level tests/Product.Tests (it does not exist).
      - name: Install template + instantiate generated product
        run: |
          set -euo pipefail
          dotnet new install .
          work="$(mktemp -d)"
          dotnet new fs-gg-ui --name GeneratedProduct --output "$work/GeneratedProduct"
          echo "PRODUCT_DIR=$work/GeneratedProduct" >> "$GITHUB_ENV"
      # Feature 212 (contract C4 / SC-005): prove the freshly scaffolded product is root-buildable
      # with the STOCK .NET CLI — no FAKE, no build.fsx knowledge — via the root <Name>.slnx, so a
      # future change that breaks stock dotnet build/test/run is caught at release time and blocks
      # the release. One config for all three (stock default/Debug), matching quickstart.md and what
      # an SDD composition-acceptance probe runs (stock declared-or-default commands); the live US1
      # smoke confirmed the stock default path. `dotnet run` exits 0 in this headless runner via the
      # entrypoint's UnsupportedEnvironment safe-degrade (research R4); `set -e` blocks on any failure.
      - name: Build, test, and run generated product (stock root, Feature 212)
        run: |
          set -euo pipefail
          dotnet build "$PRODUCT_DIR"
          dotnet test "$PRODUCT_DIR"
          dotnet run --project "$PRODUCT_DIR/src/GeneratedProduct"
      # ADR-0024 (.github#234): the game/sample-pack profiles are the FIRST CONSUMER EDGE of the
      # standalone FS.GG.Audio component ($(FsGgAudioVersion) axis) and of FS.GG.Game.Core
      # ($(FsGgGameVersion), ADR-0022 P5). The instantiation above takes the template's DEFAULT
      # profile (`app`), whose `#if (profile == "game" || profile == "sample-pack")` gate strips
      # both — so before this step NO job in any workflow ever restored or built those packages.
      # Package.Tests' AudioProfileWiringTests asserts the wiring SHAPE by reading the template
      # text; only an instantiation proves the pins RESOLVE. Without it a broken consumer edge
      # would first surface after the coherent-set release, once .github#238 has already flipped
      # the registry edge asserting it works.
      #
      # Feeds: FS.GG.UI.* resolve from the runner-local packed feed at the pin (added above);
      # FS.GG.Game.Core and FS.GG.Audio.* are separate components on their own published axes and
      # restore from nuget.org (ADR-0012/0013 dual-publish), exactly as a real consumer does.
      # No `dotnet run` here — the app profile above already covers the stock run path.
      - name: Instantiate + build the game profile (audio consumer edge, ADR-0024)
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new fs-gg-ui --name GameProduct --profile game --output "$work/GameProduct"
          dotnet build "$work/GameProduct"
          dotnet test "$work/GameProduct"
          # The pins resolving is not enough: assert the real audio realization lands in the built
          # product output, so a future gate/ref regression cannot pass by resolving-but-not-copying.
          # `-print -quit` (not `| grep -q`): under `set -o pipefail`, grep -q closes the pipe on the
          # first match, find dies of SIGPIPE (141), and the pipeline reports failure even though the
          # assembly IS present — a spurious release block. No pipe, no race.
          for pkg in Core Host Engine Elmish; do
            if [ -z "$(find "$work/GameProduct" -name "FS.GG.Audio.$pkg.dll" -print -quit)" ]; then
              echo "::error::FS.GG.Audio.$pkg.dll is missing from the built game product — the ADR-0024 consumer edge is broken."
              exit 1
            fi
          done
          echo "✓ game profile builds with all four FS.GG.Audio.* assemblies present"

  # DRAFT (FS-GG/.github#21/#22, epic #16 Pillar 4): the missing producer half of the auto-update
  # fabric. Renovate + org preset + read:packages auth are all wired and verified, but the org
  # GitHub Packages feed (nuget.pkg.github.com/FS-GG) is EMPTY — nothing ever publishes FS.GG.UI.*
  # to it, so every downstream lookup is "no-result". This job publishes the coherent set on a
  # release. GITHUB_TOKEN (packages: write) is sufficient to push to the same org's feed; no PAT.
  publish-packages:
    name: Publish FS.GG.UI.* to org GitHub Packages (release-only)
    runs-on: ubuntu-latest
    # `!inputs.validate-only` — #681. On `release-tags.yml`'s PRE-CUT call this workflow runs its
    # validators and ships nothing; the publish happens on the second call, after the tags are cut.
    # The negative phrasing is load-bearing: see the `validate-only` input's comment. An absent `inputs`
    # context (push/release/dispatch) is falsy, so every escape-hatch trigger still publishes.
    if: github.repository == 'FS-GG/FS.GG.Rendering' && !inputs.validate-only
    # Only publish a set that passed the release-only consumption checks above.
    needs: [package-tests, template-product-tests]
    permissions:
      contents: read
      packages: write
      id-token: write   # ADR-0013: mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # `github.event_name` CANNOT identify a `workflow_call` run: a called workflow reports the
      # CALLER's event. `release-tags.yml` is `push: branches: [main]`, so a call from it arrives here
      # as event_name=push with GITHUB_REF_NAME=main — the old `push)` arm would have resolved the
      # version to the literal string "main" and tried to publish it. Two corrections, both required:
      #
      #   * `inputs.version` is consulted FIRST. It is set only by `workflow_call` (required) and
      #     `workflow_dispatch` (optional); on `release` / `push: tags` the `inputs` context is empty.
      #   * the `push` arm now demands a TAG ref. A branch push can no longer name a version at all,
      #     so if the first rule is ever bypassed the result is a pack-only dry run, not a bad publish.
      - name: Resolve coherent-set version from the release tag
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            raw="$INPUT_VERSION"                                    # workflow_call (release-tags.yml) or dispatch
          else
            case "${{ github.event_name }}" in
              release)                              raw="$RELEASE_TAG" ;;
              push) if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then raw="${GITHUB_REF_NAME}"; else raw=""; fi ;;
              *)                                    raw="" ;;
            esac
          fi
          ver="${raw#v}"   # v0.1.51-preview.1 -> 0.1.51-preview.1
          if [[ -z "$ver" ]]; then
            echo "::notice::No version (manual run without input) — pack-only dry run, no push."
            echo "push=false" >> "$GITHUB_OUTPUT"
            ver="0.0.0-dryrun.${GITHUB_RUN_ID}"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Coherent-set version: $ver"

      # The guard's subject and this job's object must be ONE STRING.
      #
      # `package-tests` (needs:) proves a version coherent: it runs the Feature 209 mirror in the release
      # lane, where every waiver is off, so the repo's `<Version>` must already carry its `v*` AND
      # `fs-gg-ui-template/v*` tags. But the version it validates is the one it READS FROM THE REPO, while
      # the version resolved above comes from the TRIGGER. For `release`/`push: tags` those coincide — the
      # tag names the commit whose `<Version>` was validated. For `workflow_dispatch` they do not:
      # `inputs.version` is free text. A dispatch from a coherent `main` therefore validated `<Version>`
      # and published something else, untagged; `template-dispatch.yml` fires only on
      # `fs-gg-ui-template/v*`, so FS.GG.Templates was never told. Published, unannounced — the
      # FS-GG/.github#250 class the guard exists to catch, entered through the door beside it.
      #
      # Asserting equality closes it for every trigger at once, and needs no new rule: a dispatch may only
      # republish the version `package-tests` just proved coherent and tagged. A dry run (no input, no
      # push) is exempt — it ships nothing.
      #
      # Feature 218 adds a third trigger whose version comes from outside the ref: `workflow_call`. This
      # same assertion covers it unchanged — `release-tags.yml` reads the pending version out of the
      # guard at the very commit it is tagging, so `inputs.version` and the repo's `<Version>` are the
      # same string by construction, and this step is what proves it rather than assuming it.
      - name: Verify the version to publish is the version the guard validated
        if: steps.ver.outputs.push == 'true'
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          fsproj=".template.package/FS.GG.UI.Template.fsproj"
          repo_ver="$(grep -oP '(?<=<Version>)[^<]+' "$fsproj" | head -n1)"
          [[ -n "$repo_ver" ]] || { echo "::error::<Version> not found in $fsproj — cannot bind the publish to a validated version"; exit 1; }
          if [[ "$VER" != "$repo_ver" ]]; then
            echo "::error::Refusing to publish $VER: the coherence guard validated the repo's <Version>=$repo_ver, not $VER. On a workflow_dispatch, 'version' must name the version this commit carries (and whose v*/fs-gg-ui-template/v* tags are cut). Nothing was published."
            exit 1
          fi
          echo "✓ publishing $VER == repo <Version> ($fsproj) — the version package-tests validated in the release lane"

      # TWO decoupled axes (registry fs-gg-ui-template: version=framework pin vs package-version=tag):
      #   * the FRAMEWORK set FS.GG.UI.* is versioned by the template PIN ($(FsGgUiVersion)) — pack+push
      #     it at the pin so a template-only release (pin != $VER) does NOT republish framework members
      #     at the template version (that produced the orphaned FS.GG.UI.* 0.1.60/0.1.61 packages that
      #     no product pins). --skip-duplicate keeps it idempotent; on a framework release pin == $VER.
      #   * the TEMPLATE package FS.GG.UI.Template is versioned by the release tag $VER.
      # .template.package is NOT a slnx member, so the two packs never overlap; the template pins
      # FS.GG.UI.* at $(FsGgUiVersion)=pin, so template@$VER coherently depends on framework@pin.
      # 559 — the packages this job PUSHES are built on top of a cold, locked, config-pinned restore, the
      # same one the gate does since #482. This is the last restore before bytes reach a public feed: if
      # the committed lock files only resolve because a package was already sitting on the runner, that
      # is exactly the lock file consumers cannot restore, and warming it here is how it would ship.
      - name: Restore (locked, cold)
        uses: ./.github/actions/locked-restore
        with:
          target: FS.GG.Rendering.slnx

      # As in `template-product-tests`: the packs below deliberately re-restore rather than take
      # `--no-restore`, because `-p:Version` must be in effect DURING restore for pack to convert each
      # ProjectReference into a package dependency at the right version. It is warm and feed-free — the
      # action's cold NUGET_PACKAGES is already populated — and it is the correctness of the coherent
      # set's INTERNAL dependency versions that is at stake, so it is not an optimisation to make here.
      - name: Pack FS.GG.UI.* (framework @pin) + the template (@tag)
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          pin="$(grep -oP '(?<=<FsGgUiVersion>)[^<]+' template/base/Directory.Packages.props)"
          [[ -n "$pin" ]] || { echo "::error::<FsGgUiVersion> not found in template/base/Directory.Packages.props"; exit 1; }
          echo "Framework pin: $pin · template package version: $VER"
          dotnet pack FS.GG.Rendering.slnx -c Release -p:Version="$pin" -o artifacts/packages
          dotnet pack .template.package/FS.GG.UI.Template.fsproj -c Release -p:Version="$VER" -o artifacts/packages
          echo "Packed:"; ls -1 artifacts/packages/*.nupkg

      - name: Push coherent set to nuget.pkg.github.com/FS-GG
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
          echo "Published coherent set ${{ steps.ver.outputs.version }} to the org feed."

      # Dual-publish the BYTE-IDENTICAL coherent set to public nuget.org (ADR-0012 §1–§5) via Trusted
      # Publishing / OIDC (ADR-0013 — no stored key). Runs AFTER the org-feed push (gated ordering,
      # ADR-0012 §4): if that step fails the job stops before this one. NuGet/login mints a single-use
      # key from the org's Trusted Publishing policy (fs-gg-rendering-release); until the policy exists
      # it 401s and fails the release loud. Same artifacts/packages/*.nupkg — no re-pack (§3).
      - name: NuGet login (OIDC → short-lived nuget.org key)
        if: steps.ver.outputs.push == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Push coherent set to nuget.org (public)
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
          echo "Published coherent set ${{ steps.ver.outputs.version }} to nuget.org."
